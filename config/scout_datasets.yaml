      - name: campaign_status_display
        verbose_name: "Status (Display)"
        is_dimension: true
        is_time: false

      # Brand dimensions
      - name: brand_id
        verbose_name: "Brand ID"
        is_dimension: true
        is_time: false

      - name: brand_name
        verbose_name: "Brand"
        is_dimension: true
        is_time: false

      - name: brand_code
        verbose_name: "Brand Code"
        is_dimension: true
        is_time: false

      - name: brand_category
        verbose_name: "Brand Category"
        is_dimension: true
        is_time: false

      # Client dimensions
      - name: client_id
        verbose_name: "Client ID"
        is_dimension: true
        is_time: false

      - name: client_name
        verbose_name: "Client"
        is_dimension: true
        is_time: false

      - name: client_code
        verbose_name: "Client Code"
        is_dimension: true
        is_time: false

      - name: client_industry
        verbose_name: "Industry"
        is_dimension: true
        is_time: false

      # Channel dimensions
      - name: channel_id
        verbose_name: "Channel ID"
        is_dimension: true
        is_time: false

      - name: channel_name
        verbose_name: "Channel"
        is_dimension: true
        is_time: false

      - name: channel_type
        verbose_name: "Channel Type"
        is_dimension: true
