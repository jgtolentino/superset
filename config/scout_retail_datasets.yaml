# Scout Retail Intelligence - Superset Dataset Configuration
#
# Platform: TBWA\SMP Suqi Analytics - Retail Intelligence
# Source: scout_transactions table (Odoo ipai.scout_transaction)
# Version: 2.0
# Generated: 2026-01-12

datasets:
  # ===========================================
  # Main Fact Dataset - Retail Transactions
  # ===========================================
  - dataset_id: bi_fact_transactions
    table: bi_fact_transactions
    schema: public
    description: "Core Scout dataset - individual sari-sari store transactions with all dimensions"

    metrics:
      - name: transaction_count
        label: "Transaction Count"
        sql_expression: "COUNT(*)"
        type: "count"
        description: "Total number of transactions"

      - name: total_revenue
        label: "Total Revenue (₱)"
        sql_expression: "SUM(peso_value)"
        type: "sum"
        description: "Total transaction value in Philippine Peso"

      - name: total_units
        label: "Total Units"
        sql_expression: "SUM(units_per_transaction)"
        type: "sum"
        description: "Total product units sold"

      - name: avg_transaction_value
        label: "Avg Transaction Value (₱)"
        sql_expression: "AVG(peso_value)"
        type: "avg"
        description: "Average transaction value"

      - name: avg_basket_size
        label: "Avg Basket Size"
        sql_expression: "AVG(basket_size)"
        type: "avg"
        description: "Average number of unique SKUs per transaction"

      - name: avg_duration
        label: "Avg Duration (sec)"
        sql_expression: "AVG(duration_seconds)"
        type: "avg"
        description: "Average transaction duration in seconds"

      - name: avg_handshake_score
        label: "Avg Engagement Score"
        sql_expression: "AVG(handshake_score)"
        type: "avg"
        description: "Average customer engagement score (0-1)"

      - name: suggestion_acceptance_rate
        label: "Suggestion Accept Rate (%)"
        sql_expression: "AVG(CASE WHEN suggestion_accepted THEN 1.0 ELSE 0.0 END) * 100"
        type: "ratio"
        description: "Percentage of transactions where customer accepted suggestion"

      - name: brand_loyalty_rate
        label: "Brand Loyalty (%)"
        sql_expression: "COUNT(CASE WHEN request_type = 'branded' THEN 1 END)::FLOAT / NULLIF(COUNT(*), 0) * 100"
        type: "ratio"
        description: "Percentage of branded product requests"

      - name: discovery_rate
        label: "Discovery Rate (%)"
        sql_expression: "COUNT(CASE WHEN request_type = 'indirect' THEN 1 END)::FLOAT / NULLIF(COUNT(*), 0) * 100"
        type: "ratio"
        description: "Percentage of indirect/discovery purchases"

      - name: tbwa_market_share
        label: "TBWA Market Share (%)"
        sql_expression: "SUM(CASE WHEN is_tbwa_client THEN peso_value ELSE 0 END)::FLOAT / NULLIF(SUM(peso_value), 0) * 100"
        type: "ratio"
        description: "TBWA client brand revenue share"

      - name: unique_stores
        label: "Active Stores"
        sql_expression: "COUNT(DISTINCT store_id)"
        type: "count_distinct"
        description: "Number of unique stores with transactions"

      - name: unique_skus
        label: "Active SKUs"
        sql_expression: "COUNT(DISTINCT sku)"
        type: "count_distinct"
        description: "Number of unique products sold"

      - name: unique_brands
        label: "Active Brands"
        sql_expression: "COUNT(DISTINCT brand_name)"
        type: "count_distinct"
        description: "Number of unique brands"

      - name: digital_payment_rate
        label: "Digital Payment Rate (%)"
        sql_expression: "COUNT(CASE WHEN is_digital_payment THEN 1 END)::FLOAT / NULLIF(COUNT(*), 0) * 100"
        type: "ratio"
        description: "Percentage using GCash/Maya"

      - name: substitution_rate
        label: "Substitution Rate (%)"
        sql_expression: "COUNT(CASE WHEN substitution_occurred THEN 1 END)::FLOAT / NULLIF(COUNT(*), 0) * 100"
        type: "ratio"
        description: "Percentage of substitution events"

      - name: male_customers
        label: "Male Customers"
        sql_expression: "COUNT(CASE WHEN gender = 'male' THEN 1 END)"
        type: "count"

      - name: female_customers
        label: "Female Customers"
        sql_expression: "COUNT(CASE WHEN gender = 'female' THEN 1 END)"
        type: "count"

      - name: urban_customers_pct
        label: "Urban Customers (%)"
        sql_expression: "COUNT(CASE WHEN store_category = 'Urban' THEN 1 END)::FLOAT / NULLIF(COUNT(*), 0) * 100"
        type: "ratio"

      - name: repeat_customers_pct
        label: "Repeat Customers (%)"
        sql_expression: "COUNT(CASE WHEN is_repeat_customer THEN 1 END)::FLOAT / NULLIF(COUNT(*), 0) * 100"
        type: "ratio"

    columns:
      # Time dimensions
      - name: transaction_date
        verbose_name: "Date"
        is_dimension: false
        is_time: true
        description: "Transaction date"

      - name: timestamp
        verbose_name: "Timestamp"
        is_dimension: false
        is_time: true
        description: "Full transaction timestamp"

      - name: time_of_day
        verbose_name: "Time of Day"
        is_dimension: true
        is_time: false
        description: "morning, afternoon, evening, night"

      - name: hour_of_day
        verbose_name: "Hour"
        is_dimension: true
        is_time: false

      - name: year
        verbose_name: "Year"
        is_dimension: true
        is_time: false

      - name: quarter
        verbose_name: "Quarter"
        is_dimension: true
        is_time: false

      - name: month
        verbose_name: "Month"
        is_dimension: true
        is_time: false

      - name: month_name
        verbose_name: "Month Name"
        is_dimension: true
        is_time: false

      - name: week
        verbose_name: "Week"
        is_dimension: true
        is_time: false

      - name: day_of_week
        verbose_name: "Day of Week"
        is_dimension: true
        is_time: false

      - name: day_name
        verbose_name: "Day Name"
        is_dimension: true
        is_time: false

      - name: is_weekend
        verbose_name: "Is Weekend"
        is_dimension: true
        is_time: false

      # Geography dimensions
      - name: region
        verbose_name: "Region"
        is_dimension: true
        is_time: false
        description: "Philippine region (NCR, CALABARZON, etc.)"

      - name: province
        verbose_name: "Province"
        is_dimension: true
        is_time: false

      - name: city
        verbose_name: "City"
        is_dimension: true
        is_time: false

      - name: barangay
        verbose_name: "Barangay"
        is_dimension: true
        is_time: false

      # Store dimensions
      - name: store_id
        verbose_name: "Store ID"
        is_dimension: true
        is_time: false

      - name: store_type
        verbose_name: "Store Type"
        is_dimension: true
        is_time: false
        description: "urban_high, urban_medium, residential, rural, transport"

      - name: store_category
        verbose_name: "Store Category"
        is_dimension: true
        is_time: false
        description: "Urban, Suburban, Rural, Transit"

      - name: economic_class
        verbose_name: "Economic Class"
        is_dimension: true
        is_time: false
        description: "A, B, C, D, E socioeconomic class"

      # Product dimensions
      - name: product_category
        verbose_name: "Category"
        is_dimension: true
        is_time: false
        description: "Beverages, Snacks, Tobacco, etc."

      - name: brand_name
        verbose_name: "Brand"
        is_dimension: true
        is_time: false

      - name: sku
        verbose_name: "SKU"
        is_dimension: true
        is_time: false
        description: "Full product description"

      - name: is_tbwa_client
        verbose_name: "Is TBWA Client"
        is_dimension: true
        is_time: false

      - name: brand_type
        verbose_name: "Brand Type"
        is_dimension: true
        is_time: false
        description: "TBWA Client or Competitor"

      # Customer dimensions
      - name: gender
        verbose_name: "Gender"
        is_dimension: true
        is_time: false
        description: "male, female, unknown"

      - name: age_bracket
        verbose_name: "Age Bracket"
        is_dimension: true
        is_time: false
        description: "18-24, 25-34, 35-44, 45-54, 55+"

      - name: customer_type
        verbose_name: "Customer Type"
        is_dimension: true
        is_time: false
        description: "regular, occasional, new, unknown"

      - name: income_segment
        verbose_name: "Income Segment"
        is_dimension: true
        is_time: false
        description: "High, Middle, Low"

      # Behavior dimensions
      - name: request_mode
        verbose_name: "Request Mode"
        is_dimension: true
        is_time: false
        description: "verbal, pointing, indirect"

      - name: request_type
        verbose_name: "Request Type"
        is_dimension: true
        is_time: false
        description: "branded, unbranded, point, indirect"

      - name: suggestion_accepted
        verbose_name: "Suggestion Accepted"
        is_dimension: true
        is_time: false

      - name: payment_method
        verbose_name: "Payment Method"
        is_dimension: true
        is_time: false
        description: "cash, gcash, maya, credit, other"

      - name: campaign_influenced
        verbose_name: "Campaign Influenced"
        is_dimension: true
        is_time: false

      - name: substitution_occurred
        verbose_name: "Substitution Occurred"
        is_dimension: true
        is_time: false

      - name: is_multi_item_basket
        verbose_name: "Multi-Item Basket"
        is_dimension: true
        is_time: false

      - name: is_repeat_customer
        verbose_name: "Repeat Customer"
        is_dimension: true
        is_time: false

      - name: is_digital_payment
        verbose_name: "Digital Payment"
        is_dimension: true
        is_time: false

  # ===========================================
  # Daily Summary Dataset
  # ===========================================
  - dataset_id: bi_transaction_summary_daily
    table: bi_transaction_summary_daily
    schema: public
    description: "Daily aggregated transaction summary by region, store type, and category"

    metrics:
      - name: sum_transactions
        label: "Total Transactions"
        sql_expression: "SUM(transaction_count)"
        type: "sum"

      - name: sum_revenue
        label: "Total Revenue"
        sql_expression: "SUM(total_revenue)"
        type: "sum"

      - name: sum_units
        label: "Total Units"
        sql_expression: "SUM(total_units)"
        type: "sum"

      - name: avg_revenue_per_store
        label: "Avg Revenue/Store"
        sql_expression: "SUM(total_revenue) / NULLIF(SUM(active_stores), 0)"
        type: "ratio"

    columns:
      - name: transaction_date
        verbose_name: "Date"
        is_dimension: false
        is_time: true

      - name: region
        verbose_name: "Region"
        is_dimension: true
        is_time: false

      - name: store_type
        verbose_name: "Store Type"
        is_dimension: true
        is_time: false

      - name: product_category
        verbose_name: "Category"
        is_dimension: true
        is_time: false

