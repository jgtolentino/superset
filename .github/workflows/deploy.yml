name: deploy

on:
  pull_request:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [schema_changed]

jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      - name: Log schema change event (if triggered by odoo-ce)
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "🔄 Triggered by odoo-ce schema change"
          echo "Changed files: ${{ github.event.client_payload.changed_files }}"
          echo "Commit: ${{ github.event.client_payload.commit }}"
          echo "Branch: ${{ github.event.client_payload.branch }}"

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install psycopg2-binary pyyaml
      - name: Deploy dev (drift warn)
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          ./scripts/deploy_env.sh dev

  staging_prod:
    runs-on: ubuntu-latest
    needs: dev
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install psycopg2-binary pyyaml
      - name: Deploy staging (strict)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          ./scripts/deploy_env.sh staging
      - name: Deploy prod (strict)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          ./scripts/deploy_env.sh prod
